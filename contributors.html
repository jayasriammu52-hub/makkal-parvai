<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>நிதி வழங்கியவர்கள் - மக்கள் பார்வை</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: white;
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav a {
      color: #172554;
      text-decoration: none;
      font-weight: bold;
      margin: 0 12px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card p {
      margin: 8px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>மக்கள் பார்வை</h1>
  <p>பின்னவரம்</p>
</header>

<nav>
  <a href="index.html">முகப்பு</a>
  <a href="temples.html">🛕 கோவில்கள்</a>
  <a href="contributors.html">👥 நிதி வழங்கியவர்கள்</a>
</nav>

<div class="container">

  <div class="card">
    <h2>👥 நிதி வழங்கியவர்கள்</h2>
    <p>யார் எவ்வளவு நிதி வழங்கினார்கள் என்பதை இங்கே பார்க்கலாம்.</p>
  </div>

  <div class="card">

    <h2>➕ நிதி பதிவு செய்ய</h2>

    <br>

    <input id="donorName"
      type="text"
      placeholder="பெயர்"
      style="width:100%;padding:12px;margin-bottom:10px;">

    <input id="amount"
      type="number"
      placeholder="வழங்கிய தொகை"
      style="width:100%;padding:12px;margin-bottom:10px;">

    <input id="purpose"
      type="text"
      placeholder="எதற்காக வழங்கப்பட்டது?"
      style="width:100%;padding:12px;margin-bottom:10px;">

    <input id="donationDate"
      type="date"
      style="width:100%;padding:12px;margin-bottom:10px;">

    <button onclick="addContributor()"
      style="
        background:#172554;
        color:white;
        border:none;
        padding:12px 18px;
        border-radius:8px;
        cursor:pointer;
      ">
      சேமிக்க
    </button>

  </div>

<div id="contributorsList"></div>

</div>

<script>

function addContributor() {

  const name = document.getElementById("donorName").value;
  const amount = Number(document.getElementById("amount").value);
  const purpose = document.getElementById("purpose").value;
  const date = document.getElementById("donationDate").value;

  if (!name || !amount || !purpose || !date) {
    alert("அனைத்து விவரங்களையும் நிரப்பவும்");
    return;
  }

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <h2>👤 ${name}</h2>

    <p>💰 வழங்கிய தொகை: ₹${amount.toLocaleString("en-IN")}</p>

    <p>📌 காரணம்: ${purpose}</p>

    <p>📅 தேதி: ${date}</p>
  `;

  document.getElementById("contributorsList").appendChild(card);

  document.getElementById("donorName").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("purpose").value = "";
  document.getElementById("donationDate").value = "";

}

</script>

</body>
</html>
